<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build an HTML Audio and Video Player</title>
</head>

<body>
    <section>
    <h1> Audio and video Player</h1>

    <h2>Audio player</h2>
    <video controls width="640" muted> <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
      type="video/mp4"></video> 
    </section>
    
     <section>
    <h2>Video Player</h2>
    <audio controls loop muted src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
      ></audio> 
    </section>

</body>
</html>
