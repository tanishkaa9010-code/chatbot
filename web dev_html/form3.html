<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Checkout</h1>
    <section><h2>Your Cart</h2>
        <image src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="cube"></image>
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
             <label for="card-name">card-name
                <span aria-hidden="true">*</span>
             </label>
            <input required id="card-name" name="card-name" type="text">
            <label for="card-number">Card-number
                <span aria-hidden="true">*</span>
            </label>
            <input required id="card-number" name="card-number" type="text"  aria-describedby="card-number-help">
            <p id="card-number-help">
  Enter a 16-digit card number without spaces.
</p>
        </form>
    </section>
</body>
</html>
