<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id=""description>It is a survey form</p>
    <form id=""survey-form>
        <fieldset>
                <legend>Personal information</legend>
                <label for="name" id="name-label">Name</label>
                <input id="name" type="text" placeholder="eg. abc">
                <label for="email" id="email-label">Email</label>
                <input id="email" type="email" placeholder="eg. xyz@gmail.com">
                <label for="number" id="number-label">Number</label>
                <input id="number" type="number" min="5" max="100" placeholder="eg. 10">
        </fieldset>
        <fieldset>
            <legend>Gender</legend>
            <label for="gender">Select your gender</label>
            <select name="gender" id="dropdown">
                <option value="blank"></option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Religion</legend>
            <input type="radio" id="hindu" name="name" value="hindu">
            <label>Hindu</label>
            <input type="radio" id="muslim" name="name" value="muslim">
            <label>Muslim</label>
        </fieldset>
        <fieldset>
            <legend>suggestions</legend>
            <input type="text" id="textbox" name="text" value="">
        </fieldset>
        <fieldset>
            <legend>Skills</legend>
            <input type="checkbox" id="skills" name="html" value="html">
            <label>html</label>
            <input type="checkbox" id="skills" name="html" value="html">
            <label>python</label>
            
        </fieldset>
        <button type="submit">Submit</button>


    </form>
</body>
</html>
